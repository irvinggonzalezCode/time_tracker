<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="styles.css">

  <!--
    Load order matters. Every script uses `defer`, so they run
    in this order AFTER the page has finished building:
      helper.js       - the "make it pretty" tools
      task.js         - the task list + save/load/draw
      add_task.js     - the "Add Task" popup
      timer_task.js   - the live stopwatch
      main.js         - the "on" switch (runs everything)
  -->
  <script src="helper.js" defer></script>
  <script src="task.js" defer></script>
  <script src="add_task.js" defer></script>
  <script src="timer_task.js" defer></script>
  <script src="datePicker.js" defer></script>
  <script src="test.js" defer></script>
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <section id="time-tracker-app">
      <h1 id="today-title">Time Tracker App</h1>
      <p>Today's Date: <span id="current-date"></span></p>

      <!-- Main actions: add a task by hand, undo the last one, or run a live timer -->
      <div class="task-list">
        <h2>Task List</h2>
        <button id="add-task" type="button">Add Task</button>
        <button id="remove-task" type="button">Remove Task</button>
        <button id="start-timer" type="button">Start Timer For Task</button>
      </div>

      <!-- Live timer panel. Hidden until "Start Timer For Task" is pressed. -->
      <div id="active-timer" class="active-timer" hidden>
        <span class="active-timer__pulse" aria-hidden="true"></span>

        <div class="active-timer__info">
          <input type="text" class="active-timer__action" id="active-timer-action"
            placeholder="What are you working on?" autocomplete="off">

          <input type="text" class="active-timer__description" id="active-timer-description"
            placeholder="Edit Description" autocomplete="off">

          <p class="active-timer__since" id="active-timer-since">Started 00:00 AM</p>
        </div>

        <p class="active-timer__elapsed" id="active-timer-elapsed">0s</p>
        <button type="button" class="active-timer__stop" id="stop-timer" disabled>
          Stop
        </button>
      </div>

      <!--Date Picker -->
      <div class="date-filter">
        <input type="date" id="day-picker" >
      </div>

      <!-- Finished tasks. Rows are drawn by renderTasks() in task.js. -->
      <table class="time-tracker-table" id="task-tracker">
        <thead>
          <tr>
            <th>Action</th>
            <th>Started Task</th>
            <th>Ended Task</th>
            <th>Duration</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody id="task-rows"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Time Tracker. All rights reserved.</p>
  </footer>

  <!-- "Add Task" popup. add_task.js opens, validates, and closes this. -->
  <dialog id="task-modal">
    <form id="task-form" method="dialog">
      <h2>Add New Task</h2>

      <label for="task-action">Action:</label>
      <input type="text" id="task-action" required placeholder="e.g. Coding">

      <label for="task-time">Start Time:</label>
      <input type="time" id="task-time" required>

      <label for="task-end-time">End Time:</label>
      <input type="time" id="task-end-time" required>

      <p id="duration-text">—</p>

      <label for="task-comments">Comments:</label>
      <input type="text" id="task-comments" placeholder="e.g. Started working on project X">

      <div class="modal-buttons">
        <button type="button" id="save-task-btn">Save</button>
        <button type="button" id="close-modal-btn">Cancel</button>
      </div>
    </form>
  </dialog>
</body>

</html>
