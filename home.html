<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <script src="add_task.js" defer></script>
</head>
<body>

  <main>
    <section id="time-tracker-app">
      <h1 id="today-title">Time Tracker App</h1>
       <!-- 1. Create a new Date object containing the current date and time -->
      <p>Today's Date: <span id="current-date"></span></p>

      <div class="task-list">
        <h2>Task List</h2>
        <button id="add-task" onclick="addTask()">Add Task</button>
        <button id="remove-task" onclick="removeTask()">Remove Task</button>
        <button id="start-timer" onclick="startTimer()">Start Timer For Task</button>
        <button id="stop-timer" onclick="stopTimer()">Stop Timer For Task</button>
      </div>
 
      <table class="time-tracker-table" id="task-tracker">
        <thead>
          <tr>
            <th>Action</th>
            <th>Started Task</th>
            <th>Ended Task</th>
            <th>Duration</th>
            <th>Comments</th>
          </tr>
        </thead>
        <tbody id="task-rows">
          <tr>
            <td>Start Work</td>
            <td>09:00 AM</td>
            <td>12:00 PM</td>
            <td>3 hours</td>
            <td>Started working on project X</td>
          </tr>
        </tbody>
      </table>

      
    </section>

 <script>
        // 2. Create a new Date object containing the current date and time
        const today = new Date();

        // 3. Format the date into a readable local string
        const formattedDate = today.toLocaleDateString();

        // 4. Inject the formatted date into the HTML span tag
        document.getElementById("current-date").textContent = formattedDate;
  </script>

  <footer>
    <p>&copy; 2026 Time Tracker. All rights reserved.</p>
  </footer>

<!-- Modal Dialog -->
<dialog id="task-modal">
  <form id="task-form" method="dialog">
    <h2>Add New Task</h2>
    
    <label for="task-action">Action:</label>
    <input type="text" id="task-action" required placeholder="e.g. Coding">

    <label for="task-time">Start Time:</label>
    <input type="time" id="task-time" required placeholder="e.g. 09:00 AM">

    <label for="task-end-time">End Time:</label>
    <input type="time" id="task-end-time" required placeholder="e.g. 12:00 PM">

    <p id="duration-text">Duration</p>

    <label for="task-comments">Comments:</label>
    <input type="text" id="task-comments" placeholder="e.g. Started working on project X">

    <div class="modal-buttons">
      <button type="button" id="save-task-btn">Save</button>
      <button type="button" id="close-modal-btn">Cancel</button>
    </div>
  </form>
</dialog>

</body>
</html>
